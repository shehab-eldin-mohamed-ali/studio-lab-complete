<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Studio - Validation</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- Header -->

    <header class="site-header">

        <a class="logo" href="index.html">Studio</a>

        <nav aria-label="Main navigation">
            <ul>
                <li>
                    <a href="index.html">Home</a>
                </li>

                <li>
                    <a href="components.html">Components</a>
                </li>

                <li>
                    <a class="active"
                       href="validation.html"
                       aria-current="page">
                        Validation
                    </a>
                </li>

                <li>
                    <a href="data.html">Data Table</a>
                </li>
            </ul>
        </nav>

    </header>


    <!-- Main Content -->

    <main class="container page-content">

        <section class="section">

            <h1>Registration Form</h1>

            <p>
                Enter your information and submit the form
                to test JavaScript validation.
            </p>

        </section>


        <!-- Registration Form -->

        <section class="section">

            <form id="registrationForm"
                  class="app-form"
                  novalidate>

                <!-- Name -->

                <div class="field">

                    <label for="name">Name</label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your name">

                    <span class="error" id="nameError"></span>

                </div>


                <!-- Email -->

                <div class="field">

                    <label for="email">Email</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="example@email.com">

                    <span class="error" id="emailError"></span>

                </div>


                <!-- Password -->

                <div class="field">

                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="At least 8 characters">

                    <span class="error" id="passwordError"></span>

                </div>


                <!-- Confirm Password -->

                <div class="field">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Repeat your password">

                    <span
                        class="error"
                        id="confirmPasswordError">
                    </span>

                </div>


                <!-- Age -->

                <div class="field">

                    <label for="age">Age</label>

                    <input
                        type="number"
                        id="age"
                        name="age"
                        placeholder="Enter your age">

                    <span class="error" id="ageError"></span>

                </div>


                <!-- Submit Button -->

                <button class="btn" type="submit">
                    Register
                </button>


                <!-- Success Message -->

                <p
                    id="successMessage"
                    class="success-message"
                    role="status"
                    aria-live="polite">
                </p>

            </form>

        </section>

    </main>


    <!-- Footer -->

    <footer class="site-footer">

        <p>JavaScript Form Validation</p>

    </footer>


    <!-- JavaScript -->

    <script>

        // Get the form and its input fields

        const form = document.getElementById("registrationForm");

        const nameInput = document.getElementById("name");

        const emailInput = document.getElementById("email");

        const passwordInput = document.getElementById("password");

        const confirmPasswordInput =
            document.getElementById("confirmPassword");

        const ageInput = document.getElementById("age");

        const successMessage =
            document.getElementById("successMessage");


        // Display an error message

        function showError(inputId, message) {

            document.getElementById(inputId + "Error").textContent =
                message;

        }


        // Validate Name

        function validateName() {

            const name = nameInput.value.trim();

            if (name === "") {

                showError("name", "Name is required.");

                return false;

            }

            if (name.length < 2) {

                showError(
                    "name",
                    "Name must contain at least 2 characters."
                );

                return false;

            }

            showError("name", "");

            return true;

        }


        // Validate Email

        function validateEmail() {

            const email = emailInput.value.trim();

            const emailPattern =
                /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (email === "") {

                showError("email", "Email is required.");

                return false;

            }

            if (!emailPattern.test(email)) {

                showError("email", "Please enter a valid email.");

                return false;

            }

            showError("email", "");

            return true;

        }


        // Validate Password

        function validatePassword() {

            const password = passwordInput.value;

            if (password === "") {

                showError("password", "Password is required.");

                return false;

            }

            if (password.length < 8) {

                showError(
                    "password",
                    "Password must be at least 8 characters."
                );

                return false;

            }

            showError("password", "");

            return true;

        }


        // Validate Confirm Password

        function validateConfirmPassword() {

            const password = passwordInput.value;

            const confirmPassword = confirmPasswordInput.value;

            if (confirmPassword === "") {

                showError(
                    "confirmPassword",
                    "Please confirm your password."
                );

                return false;

            }

            if (password !== confirmPassword) {

                showError(
                    "confirmPassword",
                    "Passwords do not match."
                );

                return false;

            }

            showError("confirmPassword", "");

            return true;

        }


        // Validate Age

        function validateAge() {

            const ageValue = ageInput.value;

            const age = Number(ageValue);

            if (ageValue.trim() === "") {

                showError("age", "Age is required.");

                return false;

            }

            if (
                !Number.isInteger(age) ||
                age < 1 ||
                age > 120
            ) {

                showError(
                    "age",
                    "Age must be a number between 1 and 120."
                );

                return false;

            }

            showError("age", "");

            return true;

        }


        // Validate the form when the user submits it

        form.addEventListener("submit", function (event) {

            // Prevent normal form submission

            event.preventDefault();


            // Check every field

            const isNameValid = validateName();

            const isEmailValid = validateEmail();

            const isPasswordValid = validatePassword();

            const isConfirmPasswordValid =
                validateConfirmPassword();

            const isAgeValid = validateAge();


            // If any field is invalid, stop here

            if (
                !isNameValid ||
                !isEmailValid ||
                !isPasswordValid ||
                !isConfirmPasswordValid ||
                !isAgeValid
            ) {

                successMessage.textContent = "";

                return;

            }


            // All fields are valid

            successMessage.textContent =
                "Registration successful! This is a front-end demo.";

        });


        // Clear the success message when the user edits the form

        form.addEventListener("input", function () {

            successMessage.textContent = "";

        });

    </script>

</body>

</html>
